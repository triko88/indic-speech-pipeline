# Ambiguous: English "Earth" comes from Anglo-Saxon "erda"; the word's origin is arguably erda. Both are accepted.
[qa_ta_021]
question = "பூமி என்ற சொல் எங்கிருந்து வந்தது?"
answers = ['"எர்த்" (Earth)', "எர்டா (erda)"]
answerable = true
evidence = "ஆங்கிலோ-சாக்சன் வார்த்தையான எர்டா (erda) என்பதிலிருந்து உருவானது."
