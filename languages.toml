 [ta]
 name = "Tamil"
 script_block = [0x0B80, 0x0BFF]
 indicnlp = true
 asr_model = "ai4bharat/indic-conformer-600m-multilingual"
 kathbath = "tamil"
 indicqa = "ta"
 abstain_phrases = ["no answer", "பதில் இல்லை", "தகவல் இல்லை", "குறிப்பிடப்படவில்லை", "தெரியவில்லை", "கொடுக்கப்படவில்லை"]
 # The model card lists only female Jaya/Kavitha, so the male voice is generic.
 tts_speakers = ["Jaya", "A male speaker"]
